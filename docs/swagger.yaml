basePath: /
definitions:
  api.ControllerResponse:
    properties:
      frequency:
        description: 控制频率
        example: 1000000000
        format: nanoseconds
        type: integer
      running:
        description: 运行状态
        type: boolean
      slices:
        description: 切片列表
        items:
          type: string
        type: array
      strategies:
        description: 策略名称列表
        items:
          type: string
        type: array
      used_strategy:
        description: 使用策略
        type: string
    type: object
  api.UpdateControllerRequest:
    properties:
      add_slices:
        description: 切片列表
        items:
          type: string
        type: array
      frequency:
        description: 控制频率
        example: 1000000000
        format: nanoseconds
        type: integer
      remove_slices:
        description: 移除切片
        items:
          type: string
        type: array
      running:
        description: 运行状态
        type: boolean
      used_strategy:
        description: 使用策略
        type: string
    type: object
  api.noCheckHealthResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  api.noKpiComputationCheckResponse:
    properties:
      message:
        type: string
      output:
        type: string
      status:
        type: string
    type: object
  api.noKpiComputationInstallRequest:
    properties:
      slice_id:
        description: |-
          monitornig_manager向no发送的请求实际为空, 故使用omitempty
          当sliceID为空时,暂且认为是监控全部slice
        type: string
    type: object
  api.noMdeCheckResponse:
    properties:
      message:
        type: string
      output:
        type: string
      status:
        type: string
    type: object
  api.noMdeInstallRequest:
    properties:
      slice_id:
        description: |-
          monitornig_manager向no发送的请求实际为空, 故使用omitempty
          当sliceID为空时,暂且认为是监控全部slice
        type: string
    type: object
  api.soGetSliceComponentsResponse:
    properties:
      message:
        type: string
      pods:
        description: "Example:\n{\n\t\"pods\": [\n\t  {\n\t\t\"name\": \"open5gs-smf1-000001-67cf5ccccd-rzvl6\",\n\t\t\"nf\":
          \"smf\",\n\t\t\"nss\": \"edge\",\n\t\t\"pod_ip\": \"\"\n\t  },\n\t  {\n\t\t\"name\":
          \"open5gs-upf1-000001-7f6b8444f-grp98\",\n\t\t\"nf\": \"upf\",\n\t\t\"nss\":
          \"edge\",\n\t\t\"pod_ip\": \"\"\n\t  }\n\t],\n\t\"status\": \"success\"\n
          \ }"
        items:
          properties:
            name:
              type: string
            nf:
              type: string
            nss:
              type: string
            pod_ip:
              type: string
          type: object
        type: array
      status:
        type: string
    type: object
  api.triggerRequest:
    properties:
      slices:
        items:
          type: string
        type: array
    type: object
  model.ARP:
    properties:
      pre_emption_capability:
        type: integer
      pre_emption_vulnerability:
        type: integer
      priority_level:
        type: integer
    type: object
  model.AddressValue:
    properties:
      sessionSubnets:
        description: Subnet是子网
        items:
          type: string
        type: array
      smfn3Addr:
        type: string
      smfn4Addr:
        type: string
      upfn3Addr:
        description: Addr是地址
        type: string
      upfn4Addr:
        type: string
    type: object
  model.BandwidthSpec:
    properties:
      egress:
        description: 例如 "200Mbps"
        type: string
      ingress:
        description: 例如 "100Mbps"
        type: string
    type: object
  model.BitRate:
    properties:
      unit:
        type: integer
      value:
        type: integer
    type: object
  model.Deploy:
    type: object
  model.Flow:
    properties:
      description:
        type: string
      direction:
        type: integer
    type: object
  model.GBR:
    properties:
      downlink:
        $ref: '#/definitions/model.BitRate'
      uplink:
        $ref: '#/definitions/model.BitRate'
    type: object
  model.KPI:
    properties:
      kpi_description:
        type: string
      kpi_name:
        type: string
      sub_counter:
        $ref: '#/definitions/model.SubCounter'
      units:
        type: string
    type: object
  model.MBR:
    properties:
      downlink:
        $ref: '#/definitions/model.BitRate'
      uplink:
        $ref: '#/definitions/model.BitRate'
    type: object
  model.Monitor:
    type: object
  model.MonitoringInterval:
    properties:
      adaptive:
        type: boolean
      interval_seconds:
        type: integer
    type: object
  model.PCCRule:
    properties:
      flow:
        items:
          $ref: '#/definitions/model.Flow'
        type: array
      qos:
        $ref: '#/definitions/model.QoS'
    type: object
  model.QoS:
    properties:
      arp:
        $ref: '#/definitions/model.ARP'
      gbr:
        $ref: '#/definitions/model.GBR'
      index:
        type: integer
      mbr:
        $ref: '#/definitions/model.MBR'
    type: object
  model.ResourceSpec:
    properties:
      cpu_limit:
        description: '"1"'
        type: string
      cpu_request:
        description: '"500m"'
        type: string
      memory_limit:
        description: '"1Gi"'
        type: string
      memory_request:
        description: '"512Mi"'
        type: string
    type: object
  model.SLA:
    properties:
      availability:
        description: 可用性
        type: number
      down_bandwidth:
        description: 下行带宽
        type: number
      latency:
        description: 延迟
        type: number
      up_bandwidth:
        description: 上行带宽
        type: number
    type: object
  model.SchedulingSpec:
    properties:
      node_name:
        description: 若指定，Pod 将直接运行在此节点
        type: string
      node_selector:
        additionalProperties:
          type: string
        description: 节点标签选择器
        type: object
      scheduler_name:
        description: 自定义调度器名称，默认 "default-scheduler"
        type: string
    type: object
  model.Scope:
    properties:
      scope_id:
        type: string
      scope_type:
        type: string
    type: object
  model.Session:
    properties:
      name:
        type: string
      pcc_rule:
        items:
          $ref: '#/definitions/model.PCCRule'
        type: array
      type:
        type: integer
    type: object
  model.Slice:
    properties:
      default_indicator:
        type: boolean
      sd:
        type: string
      session:
        items:
          $ref: '#/definitions/model.Session'
        type: array
      sst:
        type: integer
    type: object
  model.SliceProfile:
    properties:
      address_value:
        $ref: '#/definitions/model.AddressValue'
      deploy:
        $ref: '#/definitions/model.Deploy'
      id:
        type: string
      monitor_ref:
        type: string
      sla:
        $ref: '#/definitions/model.SLA'
      slice:
        $ref: '#/definitions/model.Slice'
    type: object
  model.SubCounter:
    properties:
      sub_counter_ids:
        items:
          type: string
        type: array
      sub_counter_type:
        type: string
    type: object
  model.SupportedKpi:
    properties:
      kpi_description:
        type: string
      kpi_name:
        type: string
      kpi_unit:
        type: string
    type: object
  monitor.Response:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
host: localhost:30001
info:
  contact: {}
  description: |-
    Slicer API
    基于Kubernetes资源的切片管理系统API
    包括 切片管理 监控管理 性能保证 等功能
  title: Slicer API
  version: "1.0"
paths:
  /controller:
    get:
      consumes:
      - application/json
      description: 返回控制器运行状态、策略列表及当前生效策略
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取控制器状态
          schema:
            $ref: '#/definitions/api.ControllerResponse'
        "500":
          description: 响应编码失败
          schema:
            type: string
      summary: 获取控制器状态
      tags:
      - Controller
    patch:
      consumes:
      - application/json
      description: 动态更新运行状态、控制频率或切换调度策略，声明式
      parameters:
      - description: 更新配置参数
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/api.UpdateControllerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 配置更新成功
        "400":
          description: 请求解析失败/策略不存在
          schema:
            type: string
        "500":
          description: 内部配置更新失败
          schema:
            type: string
      summary: 更新控制器配置
      tags:
      - Controller
  /controller/trigger:
    post:
      consumes:
      - application/json
      description: 触发控制器立即运行，可以指定切片ID或全部切片(传入空或者手动传入全部切片ID)
      parameters:
      - description: 切片ID列表, 如果为空则触发全部切片
        in: body
        name: slices
        required: true
        schema:
          $ref: '#/definitions/api.triggerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 触发成功
        "400":
          description: 请求解析失败
          schema:
            type: string
        "500":
          description: 触发控制器失败
          schema:
            type: string
      summary: 触发控制器立即运行
      tags:
      - Controller
  /monitor:
    get:
      consumes:
      - application/json
      description: 获取系统中存在的所有监控配置列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            items:
              $ref: '#/definitions/model.Monitor'
            type: array
        "500":
          description: 获取数据失败
          schema:
            type: string
      summary: 获取所有监控配置
      tags:
      - Monitor
    post:
      consumes:
      - application/json
      description: 创建监控请求并部署到Kubernetes集群，包含MDE和KPI组件
      parameters:
      - description: 监控配置对象
        in: body
        name: monitor
        required: true
        schema:
          $ref: '#/definitions/model.Monitor'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功返回监控对象
          schema:
            $ref: '#/definitions/model.Monitor'
        "400":
          description: 请求解码失败/参数验证失败
          schema:
            type: string
        "404":
          description: 关联的 Slice 不存在
          schema:
            type: string
        "500":
          description: 创建失败（YAML渲染/部署/存储）
          schema:
            type: string
      summary: 创建监控资源（内置部署）
      tags:
      - Monitor
  /monitor/{monitor_id}:
    delete:
      consumes:
      - application/json
      description: 根据ID删除监控资源并清理Kubernetes组件
      parameters:
      - description: 监控记录ID
        in: path
        name: monitorID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 资源删除成功
        "400":
          description: 缺少监控 ID 参数
          schema:
            type: string
        "404":
          description: 监控记录不存在
          schema:
            type: string
        "500":
          description: 删除失败（YAML 渲染/组件/存储）
          schema:
            type: string
      summary: 删除监控资源（内置部署）
      tags:
      - Monitor
    get:
      consumes:
      - application/json
      description: 根据监控ID获取详细配置信息
      parameters:
      - description: 监控记录ID
        in: path
        name: monitorID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/model.Monitor'
        "400":
          description: 缺少监控ID参数
          schema:
            type: string
        "404":
          description: 监控记录不存在
          schema:
            type: string
        "500":
          description: 获取数据失败
          schema:
            type: string
      summary: 获取单个监控配置
      tags:
      - Monitor
  /monitor/external:
    post:
      consumes:
      - application/json
      description: |-
        通过Monarch外部服务提交监控请求
        实际Monarch没有做任何处理, 这里将直接开启全部切片的监控, 仅用于测试
      parameters:
      - description: 监控配置对象
        in: body
        name: monitor
        required: true
        schema:
          $ref: '#/definitions/model.Monitor'
      produces:
      - application/json
      responses:
        "200":
          description: 监控创建成功, 注意没有返回值
        "400":
          description: 请求解码失败/参数验证失败/Slice不存在
          schema:
            type: string
        "500":
          description: 提交外部请求失败/存储失败
          schema:
            type: string
      summary: 创建监控资源（外部服务）
      tags:
      - Monitor
  /monitor/external/{monitor_id}:
    delete:
      consumes:
      - application/json
      description: |-
        通过Monarch外部服务删除监控请求
        实际Monarch没有做任何处理, 这里将删除createMonitorExternal创建的的监控, 仅用于测试
      parameters:
      - description: 监控记录ID
        in: path
        name: monitorID
        required: true
        type: string
      - description: 外部服务请求ID
        in: query
        name: requestId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
        "400":
          description: 缺少参数/格式错误
          schema:
            type: string
        "404":
          description: 监控记录不存在
          schema:
            type: string
        "500":
          description: 外部请求失败/存储删除失败
          schema:
            type: string
      summary: 删除监控资源（外部服务）
      tags:
      - Monitor
  /monitor/supported_kpis:
    get:
      consumes:
      - application/json
      description: 返回系统支持的所有KPI指标定义
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取KPI列表
          schema:
            items:
              $ref: '#/definitions/model.SupportedKpi'
            type: array
        "500":
          description: 服务器内部错误（获取失败）
          schema:
            type: string
      summary: 获取支持监控的KPI列表
      tags:
      - Monitor
  /nfv-orchestrator/api/health:
    get:
      consumes:
      - application/json
      description: 验证NFV编排组件的运行状态
      produces:
      - application/json
      responses:
        "200":
          description: 服务健康状态
          schema:
            $ref: '#/definitions/api.noCheckHealthResponse'
      summary: NFV Orchestrator健康检查
      tags:
      - NFV Orchestrator
  /nfv-orchestrator/kpi-computation/check:
    post:
      consumes:
      - application/json
      description: 验证KPI计算引擎Pod的运行状态
      produces:
      - application/json
      responses:
        "200":
          description: Pod状态列表
          schema:
            $ref: '#/definitions/api.noKpiComputationCheckResponse'
        "500":
          description: Pod查询失败
          schema:
            $ref: '#/definitions/api.noKpiComputationCheckResponse'
      summary: 检查KPI组件状态
      tags:
      - NFV Orchestrator
  /nfv-orchestrator/kpi-computation/install:
    post:
      consumes:
      - application/json
      description: 部署实时KPI计算引擎到监控命名空间
      parameters:
      - description: 请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.noKpiComputationInstallRequest'
      produces:
      - application/json
      responses:
        "200":
          description: KPI组件安装成功
          schema:
            $ref: '#/definitions/monitor.Response'
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/monitor.Response'
        "500":
          description: YAML渲染/K8s部署失败
          schema:
            $ref: '#/definitions/monitor.Response'
      summary: 安装KPI计算组件
      tags:
      - NFV Orchestrator
  /nfv-orchestrator/kpi-computation/uninstall:
    post:
      consumes:
      - application/json
      description: 移除KPI计算引擎相关资源
      produces:
      - application/json
      responses:
        "200":
          description: KPI组件卸载成功
          schema:
            $ref: '#/definitions/monitor.Response'
        "500":
          description: YAML渲染/K8s删除失败
          schema:
            $ref: '#/definitions/monitor.Response'
      summary: 卸载KPI计算组件
      tags:
      - NFV Orchestrator
  /nfv-orchestrator/mde/check:
    post:
      consumes:
      - application/json
      description: 验证监控数据采集器的服务端点是否就绪
      produces:
      - application/json
      responses:
        "200":
          description: MDE服务列表
          schema:
            $ref: '#/definitions/api.noMdeCheckResponse'
        "500":
          description: 服务查询失败
          schema:
            $ref: '#/definitions/api.noMdeCheckResponse'
      summary: 检查MDE运行状态
      tags:
      - NFV Orchestrator
  /nfv-orchestrator/mde/install:
    post:
      consumes:
      - application/json
      description: 根据切片ID部署Prometheus exporter组件到指定命名空间
      parameters:
      - description: 请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.noMdeInstallRequest'
      produces:
      - application/json
      responses:
        "200":
          description: MDE安装成功
          schema:
            $ref: '#/definitions/monitor.Response'
        "400":
          description: 请求参数不合法
          schema:
            $ref: '#/definitions/monitor.Response'
        "404":
          description: 切片不存在
          schema:
            $ref: '#/definitions/monitor.Response'
        "500":
          description: 渲染YAML失败/K8s部署失败
          schema:
            $ref: '#/definitions/monitor.Response'
      summary: 安装监控数据采集器（MDE）
      tags:
      - NFV Orchestrator
  /nfv-orchestrator/mde/uninstall:
    post:
      consumes:
      - application/json
      description: 移除当前命名空间下的Prometheus exporter组件
      produces:
      - application/json
      responses:
        "200":
          description: MDE卸载成功
          schema:
            $ref: '#/definitions/monitor.Response'
        "500":
          description: YAML渲染失败/K8s删除失败
          schema:
            $ref: '#/definitions/monitor.Response'
      summary: 卸载监控数据采集器（MDE）
      tags:
      - NFV Orchestrator
  /service-orchestrator/api/health:
    get:
      consumes:
      - application/json
      description: 验证Service Orchestrator组件运行状态
      produces:
      - application/json
      responses:
        "200":
          description: 服务正常运行
          schema:
            $ref: '#/definitions/monitor.Response'
      summary: 服务健康检查
      tags:
      - Service Orchestrator
  /service-orchestrator/slices/{slice_id}:
    get:
      consumes:
      - application/json
      description: 查询指定切片下的NFV组件Pod详细信息（面向监控系统）
      parameters:
      - description: 切片唯一标识符
        example: edge01
        in: path
        name: sliceID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.soGetSliceComponentsResponse'
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/monitor.Response'
        "404":
          description: 切片不存在
          schema:
            $ref: '#/definitions/monitor.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/monitor.Response'
      summary: 获取切片组件信息
      tags:
      - Service Orchestrator
  /slice:
    get:
      consumes:
      - application/json
      description: 获取当前系统中的所有切片列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功，返回切片列表
          schema:
            items:
              $ref: '#/definitions/model.SliceProfile'
            type: array
        "500":
          description: 服务器内部错误（获取列表失败、响应编码失败）
          schema:
            type: string
      summary: 获取所有切片
      tags:
      - Slice
    post:
      consumes:
      - application/json
      description: 接受一个切片对象，创建一个新的切片，并返回创建的切片对象
      parameters:
      - description: 切片对象，包含切片ID、KubeConfig和SLA等信息
        in: body
        name: slice
        required: true
        schema:
          $ref: '#/definitions/model.SliceProfile'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，返回切片及其地址
          schema:
            $ref: '#/definitions/model.SliceProfile'
        "400":
          description: 请求格式错误或参数非法
          schema:
            type: string
        "409":
          description: 切片已存在
          schema:
            type: string
        "500":
          description: 服务器内部错误，如分配IP或部署资源失败
          schema:
            type: string
      summary: 创建切片
      tags:
      - Slice
